name: Isolated v1 product
on:
  pull_request:
    paths:
      ["v1/**", "scripts/v1/**", "tests/v1-*", ".github/workflows/v1-*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gsis-v1-product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Singapore
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix v1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Production build remains unchanged
        run: git diff --exit-code
      - name: v1 contract tests (moved from the v0.9 regression shards)
        run: |
          for f in tests/v1-*.mjs; do
            case "$f" in tests/v1-product-*) continue ;; esac
            node "$f"
          done
      - run: node scripts/v1/test.mjs
      - run: node scripts/v1/build.mjs
      - name: Validate all generated Worker configurations without uploading
        run: node scripts/v1/verify-build.mjs
      - name: Package isolated artifacts
        run: tar -C deliverables/v1 -czf deliverables/GSiS-v1-local-build.tar.gz product evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gsis-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: deliverables/GSiS-v1-local-build.tar.gz
          retention-days: 14
