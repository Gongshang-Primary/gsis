name: Verify GSiS queue changes
on:
  push:
    branches:
      - codex/roster-operations-split-files
      - codex/roster-sre-fajt-r-calc
      - codex/release-version-phase2
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gsis-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Singapore
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare test browser
        run: |
          node node_modules/playwright/cli.js install --with-deps chromium
          BROWSER=$(node -p "require('playwright').chromium.executablePath()")
          echo "ROSTER_TEST_CHROMIUM=$BROWSER" >> "$GITHUB_ENV"
          echo "GSIS_BROWSER_EXECUTABLE=$BROWSER" >> "$GITHUB_ENV"
      - name: Regenerate all 18 components
        run: npm run build
      - name: Retain generated changes for exact source parity
        run: |
          python3 - <<'PY'
          import base64, subprocess
          data = base64.b64encode(subprocess.check_output(['git','diff','--no-ext-diff','--no-color','--text','--unified=3'])).decode()
          print('GSIS_GENERATED_DIFF_BEGIN')
          for i in range(0,len(data),12000):
              print('GSIS_GENERATED_DIFF_CHUNK '+data[i:i+12000])
          print('GSIS_GENERATED_DIFF_END')
          PY
      - name: Check build labels and response headers
        run: |
          node tests/release-build-label-phase2.cjs
          node tests/release-build-label-headers.cjs
      - name: Check browser fixture portability
        run: |
          node tests/roster084-private-link-reuse-browser.cjs
          node tests/roster098h-communication-display.cjs
          node tests/roster098h-publication-ui.cjs
          node tests/stapler-draft-excel-export-browser.cjs
          node tests/stapler-draft-level-recess-browser.cjs
          node tests/stapler098h-recovery-browser.cjs
      - name: Run full regression suite
        run: npm test
