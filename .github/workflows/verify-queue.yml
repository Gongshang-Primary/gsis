name: Verify GSiS queue changes
on:
  push:
    branches:
      - 'codex/**'
      - 'muse/**'
      - 'claude/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gsis-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Owner 22 Nov 2026: v1-only changes do not run the v0.9 regression shards.
  # A push is v1-only when every file changed since main is a v1 path or a v1 or
  # coordination document. Anything else, including shared/, runs every shard.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      v1only: ${{ steps.scope.outputs.v1only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: |
          git fetch --no-tags origin main
          base=$(git merge-base origin/main HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          other=$(printf '%s\n' "$changed" | grep -vE '^(v1/|scripts/v1/|tests/v1-|docs/v1/|docs/coordination/|\.github/workflows/v1-)' | grep -v '^$' || true)
          if [ -n "$changed" ] && [ -z "$other" ]; then v1only=true; else v1only=false; fi
          echo "v1only=$v1only" >> "$GITHUB_OUTPUT"
          echo "v1-only change: $v1only"
          [ -z "$other" ] || printf 'Non-v1 paths:\n%s\n' "$other"
  regression-shards:
    name: Regression shard ${{ matrix.shard }}/4
    needs: scope
    if: ${{ needs.scope.outputs.v1only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TZ: Asia/Singapore
      CI: 'true'
      GSIS_TEST_SHARD_INDEX: ${{ matrix.shard }}
      GSIS_TEST_SHARD_TOTAL: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Cache locked Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Prepare test browser
        run: |
          # Always install OS dependencies and repair missing binaries, even on cache hits.
          node node_modules/playwright/cli.js install --with-deps chromium
          BROWSER=$(node -p "require('playwright').chromium.executablePath()")
          test -x "$BROWSER"
          echo "ROSTER_TEST_CHROMIUM=$BROWSER" >> "$GITHUB_ENV"
          echo "GSIS_BROWSER_EXECUTABLE=$BROWSER" >> "$GITHUB_ENV"
      - name: Regenerate all 18 components
        run: npm run build
      - name: Check browser fixture portability
        run: |
          node tests/roster084-private-link-reuse-browser.cjs
          node tests/roster098h-communication-display.cjs
          node tests/roster098h-publication-ui.cjs
          node tests/stapler-draft-excel-export-browser.cjs
          node tests/stapler-draft-level-recess-browser.cjs
          node tests/stapler098h-recovery-browser.cjs
      - name: Run regression shard and all LORD checks
        run: npm test
  # Preserve the existing required check. Failed, cancelled or skipped shards stay red.
  full-suite:
    needs: [scope, regression-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every regression shard
        env:
          SHARD_RESULT: ${{ needs.regression-shards.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          V1_ONLY: ${{ needs.scope.outputs.v1only }}
        run: |
          if [ "$SCOPE_RESULT" = 'success' ] && [ "$V1_ONLY" = 'true' ] && [ "$SHARD_RESULT" = 'skipped' ]; then
            echo "v1-only change: v0.9 regression shards not required (v1 product workflow covers it)."
            exit 0
          fi
          if [ "$SHARD_RESULT" != 'success' ]; then
            echo "Regression shards did not all succeed: $SHARD_RESULT" >&2
            exit 1
          fi
