name: Owner-triggered isolated v1 deployment
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Enter DEPLOY ISOLATED V1 after exact-head review and owner approval"
        required: true
        type: string
      upload_provider_credentials:
        description: "Upload existing provider credentials from this protected environment (does not activate integrations)"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY ISOLATED V1'
    environment: gsis-v1-owner-approved
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Singapore
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix v1
      - name: Validate owner-supplied isolated resource configuration
        env:
          GSIS_V1_SCHOOL_CONFIG: ${{ vars.GSIS_V1_SCHOOL_CONFIG }}
        run: node scripts/v1/prepare-deployment.mjs
      - run: node scripts/v1/build.mjs /tmp/gsis-v1-school.json
      - name: Apply isolated owner schemas and deploy services
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GSIS_SECRET: ${{ secrets.GSIS_SECRET }}
          GSIS_UPLOAD_PROVIDER_CREDENTIALS: ${{ inputs.upload_provider_credentials }}
          WHATSAPP_ACCESS_TOKEN: ${{ inputs.upload_provider_credentials && secrets.WHATSAPP_ACCESS_TOKEN || '' }}
          WHATSAPP_APP_SECRET: ${{ inputs.upload_provider_credentials && secrets.WHATSAPP_APP_SECRET || '' }}
          WHATSAPP_VERIFY_TOKEN: ${{ inputs.upload_provider_credentials && secrets.WHATSAPP_VERIFY_TOKEN || '' }}
          TELEGRAM_BOT_TOKEN: ${{ inputs.upload_provider_credentials && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_WEBHOOK_SECRET: ${{ inputs.upload_provider_credentials && secrets.TELEGRAM_WEBHOOK_SECRET || '' }}
          GOOGLE_SERVICE_ACCOUNT: ${{ inputs.upload_provider_credentials && secrets.GOOGLE_SERVICE_ACCOUNT || '' }}
          GOOGLE_HELPER_CLIENT_SECRET: ${{ inputs.upload_provider_credentials && secrets.GOOGLE_HELPER_CLIENT_SECRET || '' }}
          GOOGLE_HELPER_WRAP_KEY: ${{ inputs.upload_provider_credentials && secrets.GOOGLE_HELPER_WRAP_KEY || '' }}
          EMAIL_API_TOKEN: ${{ inputs.upload_provider_credentials && secrets.EMAIL_API_TOKEN || '' }}
        run: node scripts/v1/deploy.mjs
