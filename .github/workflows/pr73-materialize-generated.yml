name: PR73 generated object preparation
on:
  push:
    branches: ['codex/roster-daily-relief-cap']
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'helper-gsps/gsis' && github.ref == 'refs/heads/codex/roster-daily-relief-cap' && github.actor == 'helper-gsps'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verify the complete reviewed source tree
        run: |
          git add -u
          git rm --cached -- .github/workflows/pr73-materialize-generated.yml
          test "$(git write-tree)" = 03299b231a7241425888b3219f420dac9879b7da
      - name: Create verified Git objects without updating a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process'),crypto=require('node:crypto');
          const repo='helper-gsps/gsis',branch='codex/roster-daily-relief-cap',expectedTree='03299b231a7241425888b3219f420dac9879b7da';
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          const fail=message=>{throw Error(message);};
          if(process.env.GITHUB_REPOSITORY!==repo||process.env.GITHUB_REF!=='refs/heads/'+branch||process.env.GITHUB_ACTOR!=='helper-gsps')fail('Unexpected repository, branch or actor');
          const parent=process.env.GITHUB_SHA;if(!/^[a-f0-9]{40}$/.test(parent)||git('rev-parse','HEAD')!==parent||git('write-tree')!==expectedTree)fail('Source tree proof failed');
          async function api(path,body){const response=await fetch('https://api.github.com/repos/'+repo+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(30000)});if(!response.ok)fail('Git object API status '+response.status);return response.json();}
          (async()=>{
            const head=await api('/git/ref/heads/'+branch);if(head.object?.sha!==parent)fail('Branch advanced; retained objects will not be published');
            const paths=['notification-worker/dashboard-worker.mjs','notification-worker/dashboard-worker.txt','operations-worker/dashboard-worker.mjs','operations-worker/dashboard-worker.txt','Deploy_Backend_v0.9.9.gs','Roster_Backend_v0.9.9.gs','backend/Code.gs'],blobs=new Map(),tree=[];
            for(const path of paths){const bytes=fs.readFileSync(path),sha=crypto.createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex');if(!blobs.has(sha)){const result=await api('/git/blobs',{encoding:'base64',content:bytes.toString('base64')});if(result.sha!==sha)fail('Generated blob proof failed');blobs.set(sha,true);}tree.push({path,mode:'100644',type:'blob',sha});}
            tree.push({path:'.github/workflows/pr73-materialize-generated.yml',mode:'100644',type:'blob',sha:null});
            const result=await api('/git/trees',{base_tree:git('rev-parse','HEAD^{tree}'),tree});if(result.sha!==expectedTree)fail('Final tree proof failed');
            const commit=await api('/git/commits',{message:'Model: Codex\n\nMaterialize reviewed PR73 generated Worker objects',tree:expectedTree,parents:[parent]});
            console.log('GSIS_PR73_VERIFIED_COMMIT='+commit.sha);console.log('GSIS_PR73_VERIFIED_TREE='+expectedTree);
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
