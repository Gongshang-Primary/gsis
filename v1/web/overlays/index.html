<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="gsis-module" content="home"><title>GSiS · Staff workspace</title><link rel="icon" href="/contacts/favicon.ico"><link rel="stylesheet" href="/contacts/styles.css"><link rel="stylesheet" href="/v1/shared/suite.css"><script src="/v1/shared/client.js"></script><script defer src="/v1/shared/home.js"></script><style>body{background:#f4f7fa}.home{max-width:1100px;margin:24px auto;padding:16px}.home-brand{display:flex;align-items:center;gap:16px}.home-brand img{width:56px}.home-brand h1{font-size:25px;margin:0}.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:24px}.module{display:block;border:1px solid #d7e0e8;border-radius:6px;padding:20px;background:white;color:#243447;text-decoration:none}.module:hover{border-color:#3a789e;box-shadow:0 2px 9px #183e6015}.module h2{font-size:18px;margin:0 0 8px}.module p{line-height:1.5;color:#536779;margin:0}.home-account{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}#login{max-width:480px;margin:48px auto}#status{min-height:1.5em}button{cursor:pointer}[hidden]{display:none!important}</style></head><body>
<main class="home"><header class="home-brand"><img src="/contacts/logo.png" alt=""><div><h1>GSiS</h1><span id="schoolName">Staff workspace</span></div></header><p id="status" role="status">Checking your session…</p>
<section id="login" class="gsis-panel" hidden><h2>School sign-in</h2><p>Use your school Google account. Your session lasts up to ten days from sign-in.</p><div id="googleButton"></div><button id="retryLogin" hidden>Retry sign-in</button><p id="loginStatus" role="alert"></p></section>
<section id="workspace" hidden><div class="home-account"><span id="identity"></span><button id="logout">Sign out</button><a id="adminLink" href="/admin/" hidden>Administration and recovery</a></div><div id="impersonation" class="gsis-preview" hidden>Read-only impersonation is active. Changes are disabled.</div><nav id="modules" class="modules" aria-label="School applications"></nav></section>
</main></body></html>
